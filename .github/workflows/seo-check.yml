# Keeps the search-engine pages honest: the generated pages, sitemap.xml and llms.txt must match what
# scripts/seo/generate.mjs produces from the exam banks and missions, and every indexable page must meet the
# checklist in scripts/seo/check.mjs (title, description, canonical, one h1, working internal links, valid JSON-LD).
name: SEO check

on:
  push:
    branches: [master]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'robots.txt'
      - 'scripts/seo/**'
      - 'exam-simulator/banks.json'
      - 'exam-simulator/questions/**'
      - 'engineering-ops/src/content/**'
      - '.github/workflows/seo-check.yml'
  pull_request:
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'robots.txt'
      - 'scripts/seo/**'
      - 'exam-simulator/banks.json'
      - 'exam-simulator/questions/**'
      - 'engineering-ops/src/content/**'
      - '.github/workflows/seo-check.yml'

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engineering-ops/package-lock.json
      # esbuild, already a dependency of the app, bundles the TypeScript missions for the generator.
      - run: npm ci
        working-directory: engineering-ops
      - run: node scripts/seo/generate.mjs --check
