# Rebuilds engineering-ops/dist whenever Engineering Ops source lands on master,
# because GitHub Pages serves this branch as-is and cannot run a build itself.
#
# - Pull requests: typecheck, lint, test and build only (nothing is committed).
# - Push to master (i.e. a merge): the same checks, then commit the refreshed dist/ back.
#
# The commit is made with GITHUB_TOKEN, and commits pushed that way do not start new
# workflow runs, so this cannot loop. The paths filter also ignores dist/ itself.
name: Build Engineering Ops

on:
  push:
    branches: [master]
    paths:
      - 'engineering-ops/**'
      - '!engineering-ops/dist/**'
      - '.github/workflows/build-engineering-ops.yml'
  pull_request:
    paths:
      - 'engineering-ops/**'
      - '!engineering-ops/dist/**'
  workflow_dispatch:

permissions:
  contents: write

# Never run two builds that could both push to master at once.
concurrency:
  group: build-engineering-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engineering-ops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engineering-ops/package-lock.json

      - run: npm ci

      - name: Typecheck, lint and test
        run: npm run check

      - name: Build
        run: npx vite build

      - name: Commit refreshed dist
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          git add -A engineering-ops/dist
          if git diff --cached --quiet; then
            echo "dist/ already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild engineering-ops/dist [skip ci]"
          git push
